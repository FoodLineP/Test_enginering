<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Тест — Головний інженер нового виробництва</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --text:#1b1f24; --muted:#5c6670; --line:#d9dfe6;
  --accent:#0b5fa5; --accent-soft:#e7f0fa; --ok:#1e8e3e; --warn:#b26a00; --bad:#c62828;
  --bad-soft:#fdecec; --warn-soft:#fff4e0; --ok-soft:#e8f5ec; --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1317; --card:#171c22; --text:#e6e9ee; --muted:#9aa4ae; --line:#2a323c;
    --accent:#6fb3ea; --accent-soft:#15283a; --ok:#5fbf78; --warn:#e0a23a; --bad:#ef6b6b;
    --bad-soft:#3a1c1c; --warn-soft:#3a2d12; --ok-soft:#163421; --shadow:none; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text)}
h1{font-size:26px;line-height:1.25;margin:0 0 12px}
h2{font-size:21px;line-height:1.3;margin:0 0 12px}
h3{font-size:17px;margin:20px 0 8px}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px;padding-left:22px}
li{margin:4px 0}
a{color:var(--accent)}
table{border-collapse:collapse;width:100%;margin:8px 0 14px;font-size:15px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:600}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.93em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:14px}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;margin-right:6px}
.notice{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:8px;margin:14px 0}
.notice.warn{border-color:var(--warn);background:var(--warn-soft)}
.notice.bad{border-color:var(--bad);background:var(--bad-soft)}
.notice.ok{border-color:var(--ok);background:var(--ok-soft)}

/* top bar */
#topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:8px 16px;flex-wrap:wrap}
#topbar[hidden]{display:none}
#topbar .brand{font-weight:700;font-size:15px;flex:1 1 220px}
.timers{display:flex;gap:18px;flex-wrap:wrap}
.timer{display:flex;flex-direction:column;min-width:130px}
.timer span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.timer b{font-size:19px;font-variant-numeric:tabular-nums;line-height:1.2}
.timer .bar{height:5px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}
.timer .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .5s}
.timer.warn b{color:var(--warn)} .timer.warn .bar i{background:var(--warn)}
.timer.bad b{color:var(--bad)} .timer.bad .bar i{background:var(--bad)}

/* layout */
.wrap{max-width:1180px;margin:20px auto;padding:0 16px}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;max-width:1180px;margin:20px auto;padding:0 16px;align-items:start}
.sidebar{position:sticky;top:78px;max-height:calc(100vh - 100px);overflow:auto;padding:14px}
.sidebar h4{margin:10px 0 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sidebar .qi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:6px 8px;color:var(--text);cursor:pointer;font:inherit;font-size:14px}
.sidebar .qi:hover{background:var(--accent-soft)}
.sidebar .qi.cur{border-color:var(--accent);background:var(--accent-soft)}
.sidebar .qi .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.sidebar .qi.done .dot{background:var(--ok)}
.sidebar .qi .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar .qi em{font-style:normal;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.sidebar .qi.block{font-weight:600;color:var(--muted)}
#side-toggle{display:none}
@media (max-width: 920px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:static;max-height:none;display:none}
  .sidebar.open{display:block}
  #side-toggle{display:inline-block}
}

/* question */
.q-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.q-body{margin-bottom:16px}
.q-body p{margin-bottom:10px}
details.ref{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0 16px;background:var(--bg)}
details.ref summary{cursor:pointer;font-weight:600}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 14px;margin-top:8px}
.f{display:flex;flex-direction:column;gap:4px}
.f span{font-size:14px;color:var(--muted)}
.f.wide{grid-column:1 / -1}
input[type=text],textarea{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:170px;resize:vertical;line-height:1.5}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
input:disabled,textarea:disabled{opacity:.6}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border-radius:9px;padding:10px 18px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.secondary{background:transparent;color:var(--accent)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
label.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0}
label.check input{margin-top:5px;width:18px;height:18px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 14px;margin:12px 0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:8px 0 14px}
.kv b{font-weight:600}
pre.ans{white-space:pre-wrap;word-wrap:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;margin:4px 0 10px}
.status-ok{color:var(--ok);font-weight:600}
.status-bad{color:var(--bad);font-weight:600}
.status-warn{color:var(--warn);font-weight:600}
footer.foot{text-align:center;color:var(--muted);font-size:13px;padding:20px}
dialog#gloss{border:1px solid var(--line);border-radius:var(--radius);padding:0;max-width:760px;width:calc(100% - 32px);max-height:85vh;background:var(--card);color:var(--text);box-shadow:0 12px 40px rgba(0,0,0,.25)}
dialog#gloss::backdrop{background:rgba(0,0,0,.45)}
#gloss .g-head{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
#gloss .g-head h2{margin:0;flex:1;font-size:18px}
#gloss .g-head input{flex:1 1 200px;max-width:320px}
#gloss .g-body{padding:10px 18px 18px;overflow:auto;max-height:calc(85vh - 70px)}
#gloss h4{margin:16px 0 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
#gloss dl{margin:0}
#gloss dt{font-weight:600;margin-top:8px}
#gloss dd{margin:2px 0 0;color:var(--text)}
#gloss .g-note{font-size:13px;color:var(--muted);margin:6px 0 0}
#gloss .hit{background:var(--warn-soft)}
.g-inline dt{font-weight:600;margin-top:8px}.g-inline dd{margin:2px 0 0}
@media print{#topbar,.sidebar,.nav,.btn{display:none!important}.layout{display:block}}
</style>
</head>
<body>

<header id="topbar" hidden>
  <div class="brand">Тест: головний інженер нового виробництва</div>
  <div class="timers">
    <div class="timer" id="tm-total"><span>Загальний час</span><b>0:00:00</b></div>
    <div class="timer" id="tm-block"><span>Блок</span><b>0:00</b><div class="bar"><i></i></div></div>
    <div class="timer" id="tm-q"><span>Це питання</span><b>0:00</b></div>
  </div>
  <button class="btn ghost" id="side-toggle" type="button">Список питань</button>
  <button class="btn ghost" id="gloss-btn" type="button">Глосарій</button>
  <button class="btn danger" id="btn-finish" type="button">Завершити тест</button>
</header>

<main id="app"></main>
<dialog id="gloss">
  <div class="g-head"><h2>Глосарій термінів</h2><input type="search" id="gloss-q" placeholder="Пошук терміна…" autocomplete="off"><button class="btn ghost" id="gloss-close" type="button">Закрити</button></div>
  <div class="g-body" id="gloss-body"></div>
</dialog>

<footer class="foot">Відповіді зберігаються у вашому браузері й передаються роботодавцю лише після натискання «Завершити тест».</footer>
<noscript><div class="wrap"><div class="card notice bad">Для проходження тесту потрібно увімкнути JavaScript.</div></div></noscript>

<script>
'use strict';

/* ============================================================
   НАЛАШТУВАННЯ — змінюйте тут
   ============================================================ */
const CONFIG = {
  version: '2026-10-16b',
  position: 'Головний інженер з облаштування та запуску нового харчового виробництва',
  company: 'Foodline Production',
  resultsEmail: 'y_buznitskiy@vsesvit-group.com.ua',   // резервна адреса (якщо автоматичне надсилання недоступне) і для ескізів
  submitUrl: '',            // URL веб-застосунку Google Apps Script (Code.gs) — після Deploy вставте сюди
  submitToken: 'foodline-ge-2026',   // має збігатися з TOKEN у Code.gs
  storageKey: 'foodline-chief-engineer-test-v1',
  hardLimit: false,  // true — блокувати відповіді блоку після перевищення рекомендованого часу
};

const BLOCKS = [
  { id:'A', short:'Блок A', title:'Блок A — Нормативи, інженерні системи, гігієнічний дизайн', limitMin:40, points:2,
    intro:`<p><b>12 питань, по 2 бали. Рекомендований час — 40 хвилин.</b></p>
<p>Відповідайте стисло: 3–5 речень або список. Цінуються конкретика, числа й посилання на норми (ДБН, ДСТУ, ПУЕ, ISO), а не загальні слова. Відповідь без конкретики не зараховується.</p>
<p>Контекст усіх завдань: виробництво соусів (гарячі варки, кислі й солоні продукти), сертифікація FSSC 22000; після запуску головний інженер керує технічною службою цеху. Новий цех — двоповерхова будівля: варка на 2-му поверсі, фасування і склад — на 1-му. Пара — від твердопаливного котла на дровах, робочий тиск 2–5 бар. Усі числа, потрібні для відповіді, наведені в самих питаннях; знання конкретного підприємства не потрібне.</p>` },
  { id:'B', short:'Блок B', title:'Блок B — Розрахункові задачі', limitMin:80, points:8,
    intro:`<p><b>4 задачі, по 8 балів. Рекомендований час — 80 хвилин.</b></p>
<p>У кожній задачі оцінюється хід розв'язку: формули, одиниці вимірювання, припущення, висновок. Число без обґрунтування — 0 балів. Ключові числа запишіть в окремі поля, повний хід — у поле «Хід розв'язку». Якщо даних не вистачає — прийміть інженерне припущення і запишіть його явно.</p>
<p>Довідкові дані (нижче) доступні в кожній задачі блоку.</p>`,
    reference:`<p><b>Властивості насиченої водяної пари</b></p>
<table><thead><tr><th>p абс., бар</th><th>p ізб., бар</th><th>t насичення, °C</th><th>Теплота пароутворення r, кДж/кг</th><th>Ентальпія пари h'', кДж/кг</th><th>Питомий об'єм v'', м³/кг</th></tr></thead>
<tbody><tr><td>3</td><td>2</td><td>133,5</td><td>2 163</td><td>2 725</td><td>0,606</td></tr>
<tr><td>4</td><td>3</td><td>143,6</td><td>2 133</td><td>2 738</td><td>0,462</td></tr>
<tr><td>5</td><td>4</td><td>151,8</td><td>2 108</td><td>2 749</td><td>0,375</td></tr>
<tr><td>6</td><td>5</td><td>158,8</td><td>2 086</td><td>2 757</td><td>0,316</td></tr></tbody></table>
<p>Вода: c = 4,19 кДж/(кг·К), ρ = 1 000 кг/м³; ентальпія живильної води 60 °C — 251 кДж/кг. Повітря: ρ = 1,2 кг/м³, c = 1,005 кДж/(кг·К).</p>` },
  { id:'C', short:'Блок C', title:'Блок C — Кейси', limitMin:80, points:10,
    intro:`<p><b>3 кейси, по 10 балів. Рекомендований час — 80 хвилин.</b></p>
<p>Пишіть як для підрядника або керівника, а не як есе: пункти, числа, посилання на норми, терміни, відповідальні. Обсяг — до 1 сторінки на кейс. Оцінюється технічна повнота (4), нормативні посилання й числа (3), управлінська логіка — хто, коли, за чий кошт (3).</p>
<p>Ескіз до кейсу C1 — за бажанням: окремим файлом (фото або PDF) у листі зі звітом.</p>` },
];

const T = (label, key='answer') => ({ type:'textarea', key, label });
const N = (key, label) => ({ type:'number', key, label });
const S = (key, label) => ({ type:'text', key, label });

const QUESTIONS = [
  // ---------- Блок A ----------
  { id:'A1', block:'A', title:'Зонування і потоки',
    body:`<p>Варка — на 2-му поверсі, фасування і склад готової продукції — на 1-му, приймання сировини — з двору на 1-му. Опишіть, як ви розділите цех на зони за рівнем гігієнічного ризику (мінімум три рівні) і які п'ять потоків не повинні перетинатися. Де в такій двоповерховій будівлі найімовірніше виникне перетин потоків і як ви усунете його конструктивно?</p>`,
    fields:[T('Відповідь')] },
  { id:'A2', block:'A', title:'Повітряний баланс',
    body:`<p>Яким має бути напрямок і величина перепаду тиску повітря між зоною фасування (відкритий продукт) та суміжними коридором і складом? Що станеться, якщо витяжка над варочними котлами працює, а припливна установка — ні? Назвіть три наслідки для гігієни та для будівлі.</p>`,
    fields:[T('Відповідь')] },
  { id:'A3', block:'A', title:'Підлога',
    body:`<p>Для варочного й фасувального відділень обрано поліуретан-цементне покриття. Поясніть, чому PU-цемент, а не епоксид, для зони з гарячою водою і парою. Вкажіть мінімальний уклон до трапів, радіус галтелі «стіна–підлога», висоту заведення покриття на стіну та правило розміщення трапа відносно обладнання.</p>`,
    fields:[T('Відповідь')] },
  { id:'A4', block:'A', title:'Матеріал продуктових ємностей і трубопроводів',
    body:`<p>Продукт 1 — соєвий соус: NaCl 15–18 %, pH 4,5–5,0, зберігання при кімнатній температурі. Продукт 2 — кисло-солодкий соус: pH 3,0–3,5, оцет, варка до 95 °C. Для ємностей і трубопроводів — AISI 304 чи AISI 316L? Обґрунтуйте через механізм корозії, що тут загрожує, і показник PREN. Де в цьому ж цеху AISI 304 буде достатньо?</p>`,
    fields:[T('Відповідь')] },
  { id:'A5', block:'A', title:'Чистота пари',
    body:`<p>Пара — від твердопаливного котла на дровах, 2–5 бар. Чи можна цією парою нагрівати продукт прямим впорскуванням (direct steam injection)? Які вимоги до пари (фільтрація, сепарація, хімводопідготовка котла, дозволені реагенти) треба виконати і чим це відрізняється від пари в сорочці варочного котла?</p>`,
    fields:[T('Відповідь')] },
  { id:'A6', block:'A', title:'Класифікація приміщень в електропроєкті',
    body:`<p>Проєкт електропостачання класифікував варочне і мийне відділення як складські приміщення. Поясніть, чому це критична помилка: яку категорію за умовами середовища вони мають отримати за ПУЕ / ДБН В.2.5-23, і назвіть щонайменше чотири наслідки для проєкту (ступінь захисту обладнання, тип кабелю і спосіб прокладання, захисні апарати, система зрівнювання потенціалів, розміщення щитів).</p>`,
    fields:[T('Відповідь')] },
  { id:'A7', block:'A', title:'Категорії за пожежною небезпекою',
    body:`<p>Визначте й обґрунтуйте категорію (А, Б, В, Г, Д за ДСТУ Б В.1.1-36) для: (а) котельні на дровах; (б) складу тари — гофрокартон, ПЕТ-пляшки, стретч-плівка; (в) варочного відділення. Що відрізняє В від Д і яким документом категорія фіксується?</p>`,
    fields:[T('Відповідь')] },
  { id:'A8', block:'A', title:'Дозвільні документи',
    body:`<p>Складіть перелік дозволів і реєстрацій, без яких новий харчовий цех із паровим котлом не можна юридично запустити: будівельна частина (ДІАМ), Держпраці (обладнання та роботи підвищеної небезпеки), Держпродспоживслужба, пожежна безпека, екологія (стоки, викиди котельні), електропостачання. Для кожного — хто заявник і реалістичний термін.</p>`,
    fields:[T('Відповідь')] },
  { id:'A9', block:'A', title:'Склад проєктної документації',
    body:`<p>Розшифруйте марки розділів: АР, КБ (КЗ, КМ), ТХ, ОВ, ВК, ЕМ, ЕО, АТХ, ПБ, ПЗ. Хто розробляє розділ ТХ для харчового виробництва і чому головний інженер замовника має контролювати його особисто? Який розділ є джерелом навантажень для ЕМ, ОВ і ВК?</p>`,
    fields:[T('Відповідь')] },
  { id:'A10', block:'A', title:'Пусконалагодження і приймання',
    body:`<p>Поясніть різницю між FAT, SAT, холодним і гарячим пуском та що означають IQ/OQ/PQ для варочного котла з паровою сорочкою і автоматичним дозуванням води. Яким документом фіксується завершення ПНР і що в ньому обов'язково є?</p>`,
    fields:[T('Відповідь')] },

  { id:'A11', block:'A', title:'Система ППР з нуля',
    body:`<p>Новий цех запущено; служба експлуатації — ви, один інженер і двоє змінних механіків. Системи планово-попереджувальних ремонтів (ППР) немає, облік простоїв не ведеться. Опишіть, як ви побудуєте ППР протягом перших трьох місяців: які реєстри й документи заведете (реєстр обладнання, карти ТО, графік), за яким принципом визначите періодичність робіт (паспорт виробника, напрацювання, критичність для випуску), як організуєте облік простоїв і хто за них відповідає, та які три показники ефективності ППР ви відстежуватимете.</p>`,

  { id:'B4', block:'B', title:'Економіка впровадження ППР',
    body:`<p><b>Дані.</b> Лінія фасування працює 2 зміни по 8 год, 22 дні на місяць. Година простою лінії коштує підприємству 10 000 грн (недовипуск, персонал, перезапуск). Зараз аварійні простої лінії — 14 год на місяць, планового ТО немає. Пропонується система ППР: планове ТО 2 год на місяць у робочий час (зупинка лінії) плюс 4 год поза змінами (без втрат випуску); витрати на запчастини й матеріали для ТО — 20 000 грн/міс; додаткове навантаження механіків оцінюється в 10 000 грн/міс. Очікуване зниження аварійних простоїв після впровадження — 60 %.</p>

<li>Які три показники ви вестимете, щоб через пів року довести ефект, і як саме обліковуватимете простої (хто фіксує, у якій формі, з якою деталізацією)?</li></ol>`,

  { id:'C1', block:'C', title:'Технічне завдання на проходи крізь міжповерхове перекриття',
    body:`<p><b>Ситуація.</b> Варка — на 2-му поверсі, фасування — на 1-му. Залізобетонне перекриття 200 мм уже залите, гільзи не закладалися. Крізь нього мають пройти: 6 продуктопроводів DN50 з нержавіючої сталі (розбірні, на клампах), паропровід DN80 і конденсатопровід DN32 (ізольовані), два трубопроводи льодяної води DN65, витяжний канал 400 × 400 мм, кабельні траси, каналізація трапів 2-го поверху DN110.</p>

    body:`<p><b>Ситуація.</b> Новий цех працюватиме у дві зміни 6 днів на тиждень. Обладнання: 6 варочних котлів з автоматикою, 3 лінії фасування, CIP-станція, чилер, компресорна, паровий ввід від існуючої котельні. Зараз технічної служби в новому цеху немає; в існуючому виробництві є один головний інженер і двоє змінних механіків за графіком 3/3, які перевантажені. Підрядники монтують обладнання й проводитимуть ПНР.</p>

/* ============================================================
   Службова частина
   ============================================================ */
const QMAP = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
const BMAP = Object.fromEntries(BLOCKS.map(b => [b.id, b]));
const STEPS = [];
BLOCKS.forEach(b => {
  STEPS.push({ type:'block', block:b.id });
  QUESTIONS.filter(q => q.block === b.id).forEach(q => STEPS.push({ type:'q', id:q.id, block:b.id }));
});
STEPS.push({ type:'review' });

const $ = sel => document.querySelector(sel);
const app = $('#app');
const topbar = $('#topbar');

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function fmtClock(ms){ const s = Math.floor(ms/1000); const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60; return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`; }
function fmtLong(ms){ const s = Math.round(ms/1000); const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60; const parts=[]; if(h) parts.push(h+' год'); if(h||m) parts.push(m+' хв'); parts.push(sec+' с'); return parts.join(' '); }
function fmtDT(iso){ if(!iso) return '—'; const d = new Date(iso); return d.toLocaleString('uk-UA', { dateStyle:'medium', timeStyle:'medium' }); }
function nowIso(){ return new Date().toISOString(); }

function freshState(){
  return { version:CONFIG.version, status:'intro', candidate:{ name:'', contact:'' }, startedAt:null, finishedAt:null,
    step:0, answers:{}, q:{}, blocks:{}, activeMs:0, away:{ count:0, ms:0 }, pauses:[], lastSeen:null,
    submissionId:null, submitted:false, submittedAt:null, submitError:null };
}
function qstat(id){ return state.q[id] || (state.q[id] = { activeMs:0, visits:0, firstOpenedAt:null, lastEditAt:null, pasteCount:0, pastedChars:0, edits:0 }); }
function bstat(id){ return state.blocks[id] || (state.blocks[id] = { activeMs:0, enteredAt:null }); }

function load(){
  try { const raw = localStorage.getItem(CONFIG.storageKey); if(!raw) return null; const s = JSON.parse(raw); if(s.version !== CONFIG.version) return null; return s; }
  catch(e){ return null; }
}
let saveTimer = null;
function save(){
  state.lastSeen = Date.now();
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); } catch(e) { /* приватний режим — працюємо в пам'яті */ }
}
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }
function getRuns(){ try { return parseInt(localStorage.getItem(CONFIG.storageKey + ':runs') || '0', 10) || 0; } catch(e){ return 0; } }
function bumpRuns(){ try { localStorage.setItem(CONFIG.storageKey + ':runs', String(getRuns() + 1)); } catch(e){} }

let state = load() || freshState();

// пауза: сторінку закривали під час тесту
if (state.status === 'running' && state.lastSeen && Date.now() - state.lastSeen > 30000) {
  state.pauses.push({ from:new Date(state.lastSeen).toISOString(), to:nowIso(), ms:Date.now() - state.lastSeen });
  save();
}

/* ---------- облік "поза вкладкою" ---------- */
let awayStart = null;
function goAway(){ if (state.status !== 'running' || awayStart) return; awayStart = Date.now(); state.away.count++; save(); }
function comeBack(){ if (!awayStart) return; state.away.ms += Date.now() - awayStart; awayStart = null; save(); }
document.addEventListener('visibilitychange', () => document.hidden ? goAway() : comeBack());
window.addEventListener('blur', goAway);
window.addEventListener('focus', () => { if (!document.hidden) comeBack(); });
window.addEventListener('pagehide', () => { clearTimeout(saveTimer); if (state.status === 'running') { comeBack(); } save(); });

/* ---------- таймер ---------- */
let ticks = 0;
setInterval(() => {
  if (state.status !== 'running') return;
  if (awayStart === null && !document.hidden) {
    state.activeMs += 1000;
    const st = STEPS[state.step];
    if (st && st.block) bstat(st.block).activeMs += 1000;
    if (st && st.type === 'q') qstat(st.id).activeMs += 1000;
  }
  if (++ticks % 5 === 0) save();
  renderTimers();
}, 1000);

function renderTimers(){
  if (state.status !== 'running') { topbar.hidden = true; return; }
  topbar.hidden = false;
  const wall = state.startedAt ? Date.now() - new Date(state.startedAt).getTime() : 0;
  $('#tm-total b').textContent = fmtClock(wall);
  const st = STEPS[state.step];
  const tb = $('#tm-block'), tq = $('#tm-q');
  if (st && st.block) {
    const b = BMAP[st.block], ms = bstat(b.id).activeMs, lim = b.limitMin * 60000, r = ms / lim;
    tb.querySelector('span').textContent = `${b.short} · рекомендовано ${b.limitMin} хв`;
    tb.querySelector('b').textContent = `${fmtClock(ms)} / ${b.limitMin}:00`;
    tb.querySelector('.bar i').style.width = Math.min(100, r * 100) + '%';
    tb.className = 'timer' + (r >= 1 ? ' bad' : r >= 0.85 ? ' warn' : '');
    tb.style.visibility = 'visible';
  } else { tb.style.visibility = 'hidden'; }
  if (st && st.type === 'q') { tq.querySelector('b').textContent = fmtClock(qstat(st.id).activeMs); tq.style.visibility = 'visible'; }
  else tq.style.visibility = 'hidden';
}

/* ---------- стан відповідей ---------- */
function isAnswered(q){ const a = state.answers[q.id]; return !!a && q.fields.some(f => (a[f.key] || '').trim() !== ''); }
function answeredCount(blockId){ return QUESTIONS.filter(q => (!blockId || q.block === blockId) && isAnswered(q)).length; }
function blockExceeded(b){ return bstat(b.id).activeMs >= b.limitMin * 60000; }

/* ---------- рендер ---------- */
function render(){
  renderTimers();
  if (state.status === 'intro') return renderIntro();
  if (state.status === 'finished') return renderReport();
  const st = STEPS[state.step];
  let main = '';
  if (st.type === 'block') main = renderBlockIntro(BMAP[st.block]);
  else if (st.type === 'q') main = renderQuestion(QMAP[st.id]);
  else main = renderReview();
  app.innerHTML = `<div class="layout">${renderSidebar()}<section>${main}</section></div>`;
  window.scrollTo({ top: 0 });
}

function renderIntro(){
  const runs = getRuns();
  app.innerHTML = `<div class="wrap"><article class="card">
  <span class="chip">${esc(CONFIG.company)}</span>
  <h1>Тест для кандидата на посаду<br>«${esc(CONFIG.position)}»</h1>
  <p class="muted">Письмове випробування високого рівня складності: перевіряються інженерні розрахунки, рішення в реальних ситуаціях нового цеху і знання української нормативної бази, а не терміни. Усі вихідні дані наведені в самих завданнях — знання конкретного підприємства не потрібне.</p>

  <h3>Структура тесту</h3>
  <table><thead><tr><th>Блок</th><th>Зміст</th><th>Рекомендований час</th><th>Балів</th></tr></thead><tbody>
  ${BLOCKS.map(b => `<tr><td>${esc(b.short)}</td><td>${esc(b.title.replace(/^Блок [A-C] — /, ''))} — ${QUESTIONS.filter(q=>q.block===b.id).length} завдань</td><td>${b.limitMin} хв</td><td>${QUESTIONS.filter(q=>q.block===b.id).length} × ${b.points} = ${QUESTIONS.filter(q=>q.block===b.id).length * b.points}</td></tr>`).join('')}
  <tr><td colspan="2"><b>Разом</b></td><td><b>${BLOCKS.reduce((s,b)=>s+b.limitMin,0)} хв (${(BLOCKS.reduce((s,b)=>s+b.limitMin,0)/60).toFixed(1).replace('.0','').replace('.',',')} год)</b></td><td><b>${QUESTIONS.reduce((s,q)=>s+BMAP[q.block].points,0)}</b></td></tr>
  </tbody></table>

  <h3>Як проходити тест</h3>
  <ol>
    <li>Питання показуються по одному. Можна повертатися до будь-якого питання через список зліва і змінювати відповідь до моменту завершення.</li>
    <li>Відповіді зберігаються автоматично в цьому браузері. Якщо сторінку закрити й відкрити знову на тому самому пристрої в тому самому браузері — тест продовжиться з того ж місця, а пауза буде зафіксована.</li>
    <li>Рекомендований час по блоках — орієнтир. Таймер не зупиняє тест автоматично, але перевищення фіксується. Таймери відображаються вгорі сторінки.</li>
    <li>Калькулятор, власні нотатки формул і довідкові таблиці дозволені. Довідкові дані по парі та воді наведені в блоці B; розшифровка скорочень і термінів — кнопка «Глосарій» вгорі сторінки (доступна на кожному питанні). Користування інтернет-довідниками не заборонене, але час фіксується — довгий пошук буде видно.</li>
    <li>Заборонені ШІ-помічники та стороння допомога. Відповіді захищаються усно на співбесіді: інтерв'юер поставить уточнювальні запитання по вашим розв'язкам.</li>
    <li>У блоці B число без ходу розв'язку — 0 балів. Якщо даних не вистачає — приймайте інженерне припущення і записуйте його явно.</li>
    <li>Ескіз до кейсу C1 — за бажанням: окремим файлом (фото, PDF) разом зі звітом.</li>
  </ol>

  <div class="notice warn">
    <b>Що фіксується під час тесту (моніторинг часу й активності).</b> Усе перелічене передається роботодавцю разом із вашими відповідями після завершення тесту:
    <ul>
      <li>загальний час від натискання «Почати тест» до «Завершити тест»;</li>
      <li>активний час на кожному питанні (поки питання відкрите, а вкладка активна), кількість повернень до питання і час останньої правки;</li>
      <li>час у кожному блоці порівняно з рекомендованим;</li>
      <li>перемикання на інші вкладки або вікна — кількість і загальна тривалість;</li>
      <li>паузи, коли сторінку закривали;</li>
      <li>кількість вставлень тексту з буфера обміну в поля відповідей та обсяг вставленого тексту;</li>
      <li>кількість запусків тесту в цьому браузері.</li>
    </ul>
    До натискання «Завершити тест» нічого не передається — усі дані зберігаються лише у вашому браузері.
  </div>

  <details class="ref"><summary>Глосарій термінів, що трапляються в завданнях</summary><div class="g-inline">${glossaryHtml('', true)}</div></details>

  <h3>Як здати результати</h3>
  <ol>
    <li>Після відповіді на останнє питання натисніть «Завершити тест» і підтвердіть. Після цього змінювати відповіді не можна.</li>
    <li>Відповіді та хронометраж надсилаються роботодавцю автоматично — вам нічого робити не потрібно. Сторінка покаже підтвердження.</li>
    <li>Якщо в момент завершення не буде інтернету, сторінка запропонує скачати звіт і надіслати його на <a href="mailto:${esc(CONFIG.resultsEmail)}">${esc(CONFIG.resultsEmail)}</a>. Туди ж — ескіз до кейсу C1, якщо ви його робили.</li>
  </ol>
  <p class="small muted">Рекомендуємо проходити тест на комп'ютері. Інтернет потрібен лише для відкриття сторінки та для надсилання результатів наприкінці. Не очищуйте дані браузера, доки не побачите підтвердження надсилання.</p>

  ${runs ? `<p class="small muted">Тест у цьому браузері вже запускали: ${runs} раз(ів). Це буде зафіксовано у звіті.</p>` : ''}

  <h3>Дані кандидата</h3>
  <div class="form-grid">
    <label class="f"><span>Прізвище, ім'я *</span><input type="text" id="c-name" autocomplete="name" value="${esc(state.candidate.name)}"></label>
    <label class="f"><span>Телефон або e-mail *</span><input type="text" id="c-contact" autocomplete="email" value="${esc(state.candidate.contact)}"></label>
  </div>
  <label class="check"><input type="checkbox" id="c-agree"><span>Я ознайомився(-лась) з порядком проходження тесту і погоджуюся з фіксацією часу та активності, описаною вище.</span></label>
  <div class="btn-row"><button class="btn" id="btn-start" type="button">Почати тест</button></div>
  <p id="intro-err" class="status-bad small" hidden></p>
  </article></div>`;

  $('#btn-start').addEventListener('click', () => {
    const name = $('#c-name').value.trim(), contact = $('#c-contact').value.trim(), agree = $('#c-agree').checked;
    const err = $('#intro-err');
    if (!name || !contact) { err.textContent = 'Заповніть прізвище, ім\'я та контакт.'; err.hidden = false; return; }
    if (!agree) { err.textContent = 'Підтвердьте ознайомлення з порядком проходження.'; err.hidden = false; return; }
    bumpRuns();
    state = freshState();
    state.candidate = { name, contact };
    state.status = 'running';
    state.startedAt = nowIso();
    state.submissionId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));
    state.step = 0;
    enterStep(0);
    save();
    render();
  });
}

function renderResumeScreen(){
  // показується, коли є незавершена сесія
  app.innerHTML = `<div class="wrap"><article class="card">
    <h1>Незавершений тест</h1>
    <p>У цьому браузері є незавершена сесія: <b>${esc(state.candidate.name)}</b>, старт ${esc(fmtDT(state.startedAt))}. Відповідей збережено: ${answeredCount()} з ${QUESTIONS.length}.</p>
    <p class="muted small">Пауза з моменту закриття сторінки буде зафіксована у звіті.</p>
    <div class="btn-row">
      <button class="btn" id="btn-resume" type="button">Продовжити тест</button>
      <button class="btn ghost" id="btn-restart" type="button">Почати заново (відповіді буде видалено)</button>
    </div></article></div>`;
  $('#btn-resume').addEventListener('click', () => { enterStep(state.step); render(); });
  $('#btn-restart').addEventListener('click', () => {
    if (!confirm('Видалити збережені відповіді й почати тест заново? Факт повторного запуску буде зафіксовано у звіті.')) return;
    state = freshState(); save(); render();
  });
}

function renderSidebar(){
  let html = `<nav class="sidebar card" id="sidebar">`;
  BLOCKS.forEach(b => {
    const idx = STEPS.findIndex(s => s.type === 'block' && s.block === b.id);
    html += `<h4>${esc(b.short)} · ${answeredCount(b.id)}/${QUESTIONS.filter(q=>q.block===b.id).length} · ${fmtClock(bstat(b.id).activeMs)}</h4>`;
    html += `<button class="qi block ${state.step===idx?'cur':''}" data-step="${idx}" type="button"><span class="dot" style="background:transparent"></span><span class="lbl">Вступ до блоку</span></button>`;
    QUESTIONS.filter(q => q.block === b.id).forEach(q => {
      const i = STEPS.findIndex(s => s.type === 'q' && s.id === q.id);
      html += `<button class="qi ${isAnswered(q)?'done':''} ${state.step===i?'cur':''}" data-step="${i}" type="button"><span class="dot"></span><span class="lbl"><b>${q.id}</b> ${esc(q.title)}</span><em>${fmtClock(qstat(q.id).activeMs)}</em></button>`;
    });
  });
  const ri = STEPS.length - 1;
  html += `<h4>Завершення</h4><button class="qi block ${state.step===ri?'cur':''}" data-step="${ri}" type="button"><span class="dot" style="background:transparent"></span><span class="lbl">Перевірка та здача</span></button>`;
  html += `</nav>`;
  return html;
}

function renderBlockIntro(b){
  const n = QUESTIONS.filter(q => q.block === b.id).length;
  return `<article class="card">
    <span class="chip">${esc(b.short)}</span><span class="chip">${n} завдань</span><span class="chip">${b.points} бал(ів) за завдання</span><span class="chip">рекомендовано ${b.limitMin} хв</span>
    <h2>${esc(b.title)}</h2>
    ${b.intro}
    ${b.reference ? `<details class="ref" open><summary>Довідкові дані блоку B</summary>${b.reference}</details>` : ''}
    <div class="nav"><button class="btn secondary" data-go="-1" type="button">← Назад</button><button class="btn" data-go="1" type="button">Почати ${esc(b.short)} →</button></div>
  </article>`;
}

function fieldHtml(q, f, val, locked){
  const dis = locked ? 'disabled' : '';
  if (f.type === 'textarea') return `<label class="f wide"><span>${esc(f.label)}</span><textarea data-q="${q.id}" data-k="${f.key}" ${dis}>${esc(val)}</textarea></label>`;
  if (f.type === 'number') return `<label class="f"><span>${esc(f.label)}</span><input type="text" inputmode="decimal" data-q="${q.id}" data-k="${f.key}" value="${esc(val)}" ${dis}></label>`;
  return `<label class="f"><span>${esc(f.label)}</span><input type="text" data-q="${q.id}" data-k="${f.key}" value="${esc(val)}" ${dis}></label>`;
}

function renderQuestion(q){
  const b = BMAP[q.block], ans = state.answers[q.id] || {};
  const locked = CONFIG.hardLimit && blockExceeded(b);
  const i = state.step, isLast = STEPS[i+1] && STEPS[i+1].type !== 'q';
  return `<article class="card">
    <div class="q-head"><div><span class="chip">${esc(b.short)}</span><span class="chip">${b.points} бал(ів)</span></div><span class="muted small">Питання ${QUESTIONS.indexOf(q)+1} з ${QUESTIONS.length}</span></div>
    <h2>${q.id}. ${esc(q.title)}</h2>
    <div class="q-body">${q.body}</div>
    ${b.reference ? `<details class="ref"><summary>Довідкові дані блоку B</summary>${b.reference}</details>` : ''}
    ${locked ? `<div class="notice bad">Рекомендований час блоку вичерпано — відповіді в цьому блоці заблоковано.</div>` : ''}
    <div class="fields">${q.fields.map(f => fieldHtml(q, f, ans[f.key] || '', locked)).join('')}</div>
    <p class="small muted" style="margin-top:10px">Відповідь зберігається автоматично. Час на цьому питанні: <span id="q-inline-time">${fmtClock(qstat(q.id).activeMs)}</span>. <button class="btn ghost" style="padding:2px 10px;font-size:13px" data-gloss type="button">Глосарій</button></p>
    <div class="nav"><button class="btn secondary" data-go="-1" type="button">← Назад</button><button class="btn" data-go="1" type="button">${isLast ? 'Далі →' : 'Наступне питання →'}</button></div>
  </article>`;
}

function renderReview(){
  const un = QUESTIONS.filter(q => !isAnswered(q));
  return `<article class="card">
    <h2>Перевірка перед здачею</h2>
    <p>Відповідей надано: <b>${answeredCount()}</b> з ${QUESTIONS.length}.</p>
    ${un.length ? `<div class="notice warn"><b>Без відповіді:</b> ${un.map(q => `<button class="btn ghost small" style="padding:4px 10px;margin:2px" data-step="${STEPS.findIndex(s=>s.type==='q'&&s.id===q.id)}" type="button">${q.id}</button>`).join(' ')}</div>` : `<div class="notice ok">Усі питання мають відповідь.</div>`}
    <table><thead><tr><th>Блок</th><th>Відповідей</th><th>Активний час</th><th>Рекомендовано</th></tr></thead><tbody>
    ${BLOCKS.map(b => { const ms = bstat(b.id).activeMs, lim = b.limitMin*60000; return `<tr><td>${esc(b.short)}</td><td>${answeredCount(b.id)}/${QUESTIONS.filter(q=>q.block===b.id).length}</td><td class="${ms>lim?'status-bad':''}">${fmtClock(ms)}</td><td>${b.limitMin} хв</td></tr>`; }).join('')}
    </tbody></table>
    <p>Після завершення змінити відповіді буде неможливо. Відповіді та хронометраж буде надіслано роботодавцю автоматично.</p>
    <div class="nav"><button class="btn secondary" data-go="-1" type="button">← Назад до питань</button><button class="btn danger" id="btn-finish-2" type="button">Завершити тест і надіслати результати</button></div>
  </article>`;
}

/* ---------- навігація ---------- */
function enterStep(i){
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  state.step = i;
  const st = STEPS[i];
  if (st.block) { const b = bstat(st.block); if (!b.enteredAt) b.enteredAt = nowIso(); }
  if (st.type === 'q') { const qs = qstat(st.id); qs.visits++; if (!qs.firstOpenedAt) qs.firstOpenedAt = nowIso(); }
  save();
}
function go(delta){ enterStep(state.step + delta); render(); }

app.addEventListener('click', e => {
  const goBtn = e.target.closest('[data-go]');
  if (goBtn) { go(parseInt(goBtn.dataset.go, 10)); return; }
  const stepBtn = e.target.closest('[data-step]');
  if (stepBtn) { enterStep(parseInt(stepBtn.dataset.step, 10)); render(); $('#sidebar')?.classList.remove('open'); return; }
  if (e.target.id === 'btn-finish-2') finishTest();
});
app.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.q) return;
  const a = state.answers[el.dataset.q] || (state.answers[el.dataset.q] = {});
  a[el.dataset.k] = el.value;
  const qs = qstat(el.dataset.q); qs.edits++; qs.lastEditAt = nowIso();
  saveSoon();
  // оновити позначку в списку без повного перерендеру
  const q = QMAP[el.dataset.q];
  const btn = app.querySelector(`.qi[data-step="${state.step}"]`);
  if (btn && q) btn.classList.toggle('done', isAnswered(q));
});
app.addEventListener('paste', e => {
  const el = e.target; if (!el.dataset || !el.dataset.q) return;
  const qs = qstat(el.dataset.q); qs.pasteCount++;
  try { qs.pastedChars += (e.clipboardData.getData('text') || '').length; } catch(err) {}
  saveSoon();
});
$('#btn-finish').addEventListener('click', finishTest);
$('#side-toggle').addEventListener('click', () => $('#sidebar')?.classList.toggle('open'));
setInterval(() => { const el = $('#q-inline-time'); const st = STEPS[state.step]; if (el && st && st.type==='q') el.textContent = fmtClock(qstat(st.id).activeMs);
  const sb = app.querySelector(`.qi[data-step="${state.step}"] em`); if (sb && st && st.type==='q') sb.textContent = fmtClock(qstat(st.id).activeMs); }, 1000);

function finishTest(){
  if (state.status !== 'running') return;
  const un = QUESTIONS.filter(q => !isAnswered(q));
  const msg = (un.length ? `Без відповіді залишилось ${un.length} питань: ${un.map(q=>q.id).join(', ')}.\n\n` : '') + 'Завершити тест і надіслати результати? Після цього змінити відповіді буде неможливо.';
  if (!confirm(msg)) return;
  comeBack();
  state.status = 'finished';
  state.finishedAt = nowIso();
  save();
  render();
}

/* ---------- звіт ---------- */
function reportData(){
  const wallMs = state.finishedAt && state.startedAt ? new Date(state.finishedAt) - new Date(state.startedAt) : null;
  return {
    meta: { test: CONFIG.position, company: CONFIG.company, version: CONFIG.version, generatedAt: nowIso(), submissionId: state.submissionId },
    candidate: state.candidate,
    timing: { startedAt: state.startedAt, finishedAt: state.finishedAt, wallClockMs: wallMs, activeMs: state.activeMs,
      awayCount: state.away.count, awayMs: state.away.ms, pauses: state.pauses, pausesMs: state.pauses.reduce((s,p)=>s+p.ms,0), runsInBrowser: getRuns() },
    blocks: BLOCKS.map(b => ({ id:b.id, title:b.title, limitMin:b.limitMin, activeMs: bstat(b.id).activeMs, exceeded: blockExceeded(b), answered: answeredCount(b.id), total: QUESTIONS.filter(q=>q.block===b.id).length })),
    questions: QUESTIONS.map(q => { const s = qstat(q.id), a = state.answers[q.id] || {}; return {
      id:q.id, block:q.block, title:q.title, activeMs:s.activeMs, visits:s.visits, firstOpenedAt:s.firstOpenedAt, lastEditAt:s.lastEditAt,
      edits:s.edits, pasteCount:s.pasteCount, pastedChars:s.pastedChars, answered: isAnswered(q),
      answerChars: q.fields.reduce((n,f)=>n+((a[f.key]||'').length),0),
      answers: q.fields.map(f => ({ key:f.key, label:f.label, value: a[f.key] || '' })) }; }),
  };
}

function reportHtml(d){
  const css = `body{font:15px/1.5 system-ui,Arial,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;color:#1b1f24}table{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:14px}th,td{border:1px solid #cfd6dd;padding:5px 8px;text-align:left;vertical-align:top}th{background:#eef3f8}pre{white-space:pre-wrap;word-wrap:break-word;background:#f6f7f9;border:1px solid #dde2e8;border-radius:6px;padding:8px 10px;font:inherit}h1{font-size:24px}h2{font-size:19px;margin-top:28px}h3{font-size:16px;margin:18px 0 6px}.bad{color:#c62828;font-weight:600}.muted{color:#5c6670}`;
  const t = d.timing;
  let h = `<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Звіт — ${esc(d.candidate.name)}</title><style>${css}</style></head><body>
<h1>Звіт про проходження тесту</h1>
<p><b>${esc(d.meta.test)}</b><br>${esc(d.meta.company)} · версія тесту ${esc(d.meta.version)} · звіт сформовано ${esc(fmtDT(d.meta.generatedAt))}</p>
<table><tbody>
<tr><th>Кандидат</th><td>${esc(d.candidate.name)}</td></tr>
<tr><th>Контакт</th><td>${esc(d.candidate.contact)}</td></tr>
<tr><th>Початок</th><td>${esc(fmtDT(t.startedAt))}</td></tr>
<tr><th>Завершення</th><td>${esc(fmtDT(t.finishedAt))}</td></tr>
<tr><th>Загальний час (від старту до завершення)</th><td>${t.wallClockMs!=null?esc(fmtLong(t.wallClockMs)):'—'}</td></tr>
<tr><th>Активний час у тесті</th><td>${esc(fmtLong(t.activeMs))}</td></tr>
<tr><th>Поза вкладкою / вікном</th><td>${t.awayCount} раз(ів), ${esc(fmtLong(t.awayMs))}</td></tr>
<tr><th>Паузи (сторінку закривали)</th><td>${t.pauses.length ? t.pauses.map(p=>`${esc(fmtDT(p.from))} → ${esc(fmtDT(p.to))} (${esc(fmtLong(p.ms))})`).join('<br>') : 'немає'}</td></tr>
<tr><th>Запусків тесту в цьому браузері</th><td>${t.runsInBrowser}</td></tr>
</tbody></table>
<h2>Час за блоками</h2>
<table><thead><tr><th>Блок</th><th>Відповідей</th><th>Активний час</th><th>Рекомендовано</th><th>Перевищення</th></tr></thead><tbody>
${d.blocks.map(b=>`<tr><td>${esc(b.title)}</td><td>${b.answered}/${b.total}</td><td>${esc(fmtLong(b.activeMs))}</td><td>${b.limitMin} хв</td><td class="${b.exceeded?'bad':''}">${b.exceeded?'+ '+esc(fmtLong(b.activeMs-b.limitMin*60000)):'—'}</td></tr>`).join('')}
</tbody></table>
<h2>Час за питаннями</h2>
<table><thead><tr><th>№</th><th>Питання</th><th>Активний час</th><th>Відвідувань</th><th>Правок</th><th>Вставлень з буфера</th><th>Символів вставлено</th><th>Символів у відповіді</th><th>Остання правка</th></tr></thead><tbody>
${d.questions.map(q=>`<tr><td>${q.id}</td><td>${esc(q.title)}</td><td>${esc(fmtLong(q.activeMs))}</td><td>${q.visits}</td><td>${q.edits}</td><td class="${q.pasteCount?'bad':''}">${q.pasteCount}</td><td>${q.pastedChars}</td><td>${q.answered?q.answerChars:'<span class="bad">—</span>'}</td><td>${esc(fmtDT(q.lastEditAt))}</td></tr>`).join('')}
</tbody></table>
<h2>Відповіді</h2>`;
  d.questions.forEach(q => {
    h += `<h3>${q.id}. ${esc(q.title)} <span class="muted">· ${esc(fmtLong(q.activeMs))}</span></h3>`;
    if (!q.answered) { h += `<p class="bad">Без відповіді</p>`; return; }
    const shorts = q.answers.filter(a => a.key !== 'answer' && a.key !== 'solution');
    if (shorts.length) h += `<table><tbody>${shorts.map(a=>`<tr><th style="width:45%">${esc(a.label)}</th><td>${esc(a.value)||'—'}</td></tr>`).join('')}</tbody></table>`;
    q.answers.filter(a => a.key === 'answer' || a.key === 'solution').forEach(a => { h += `<p class="muted">${esc(a.label)}</p><pre>${esc(a.value) || '—'}</pre>`; });
  });
  h += `</body></html>`;
  return h;
}

function reportText(d){
  const t = d.timing;
  let s = `ЗВІТ ПРО ПРОХОДЖЕННЯ ТЕСТУ\n${d.meta.test}\nКандидат: ${d.candidate.name} (${d.candidate.contact})\nПочаток: ${fmtDT(t.startedAt)}\nЗавершення: ${fmtDT(t.finishedAt)}\nЗагальний час: ${t.wallClockMs!=null?fmtLong(t.wallClockMs):'—'}; активний: ${fmtLong(t.activeMs)}\nПоза вкладкою: ${t.awayCount} раз(ів), ${fmtLong(t.awayMs)}; пауз: ${t.pauses.length}; запусків: ${t.runsInBrowser}\n\nЧАС ЗА БЛОКАМИ\n`;
  d.blocks.forEach(b => s += `${b.id}: ${fmtLong(b.activeMs)} (рекомендовано ${b.limitMin} хв), відповідей ${b.answered}/${b.total}\n`);
  s += `\nВІДПОВІДІ\n`;
  d.questions.forEach(q => { s += `\n=== ${q.id}. ${q.title} — ${fmtLong(q.activeMs)}, відвідувань ${q.visits}, вставлень ${q.pasteCount} ===\n`;
    q.answers.forEach(a => { if (a.value) s += `${a.label}:\n${a.value}\n`; }); if (!q.answered) s += `(без відповіді)\n`; });
  return s;
}

function slug(s){ return String(s).toLowerCase().replace(/[^a-zа-яіїєґ0-9]+/gi, '_').replace(/^_+|_+$/g, '').slice(0, 40) || 'candidate'; }
function download(name, content, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }

/* ---------- завершення: автоматичне надсилання результатів ---------- */
function renderReport(){
  topbar.hidden = true;
  if (state.submitted) return renderThanks();
  if (!CONFIG.submitUrl) return renderManual(null);
  renderSending();
  submitResults().then(() => { state.submitted = true; state.submittedAt = nowIso(); state.submitError = null; save(); renderThanks(); })
    .catch(err => { state.submitError = String(err && err.message || err); save(); renderManual(state.submitError); });
}

function submitPayload(){
  const d = reportData();
  return { token: CONFIG.submitToken, id: state.submissionId, data: d, html: reportHtml(d) };
}

async function submitResults(){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 45000);
  try {
    // Content-Type text/plain → «простий» запит без preflight; Apps Script відповідає через редирект із CORS *
    const res = await fetch(CONFIG.submitUrl, { method: 'POST', body: JSON.stringify(submitPayload()), signal: ctrl.signal, redirect: 'follow' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let j = null;
    try { j = await res.json(); } catch(e) { throw new Error('Невалідна відповідь сервера'); }
    if (!j || !j.ok) throw new Error((j && j.error) || 'Сервер відхилив дані');
    return j;
  } finally { clearTimeout(timer); }
}

function renderSending(){
  app.innerHTML = `<div class="wrap"><article class="card">
    <span class="chip">Тест завершено</span>
    <h1>Надсилаємо результати…</h1>
    <p class="muted">Зачекайте кілька секунд і не закривайте сторінку.</p>
  </article></div>`;
}

function renderThanks(){
  const d = reportData();
  app.innerHTML = `<div class="wrap"><article class="card">
    <span class="chip">Тест завершено</span>
    <h1>Дякуємо, ${esc(d.candidate.name)}!</h1>
    <div class="notice ok">Результати надіслано ${esc(fmtDT(state.submittedAt))}. Ми зв'яжемося з вами щодо наступного етапу.</div>
    <p>Якщо до кейсу C1 ви готували ескіз, надішліть його на <a href="mailto:${esc(CONFIG.resultsEmail)}?subject=${encodeURIComponent('Ескіз до тесту — ' + d.candidate.name)}">${esc(CONFIG.resultsEmail)}</a>.</p>
    <div class="btn-row">
      <button class="btn secondary" id="dl-answers" type="button">Зберегти копію своїх відповідей</button>
      <button class="btn ghost" id="wipe" type="button">Очистити дані тесту з цього браузера</button>
    </div>
  </article></div>`;
  $('#dl-answers').addEventListener('click', () => download(`vidpovidi_${slug(d.candidate.name)}.html`, answersHtml(reportData()), 'text/html'));
  $('#wipe').addEventListener('click', wipeData);
}

function renderManual(errorText){
  // резервний шлях: сервер недоступний або ще не налаштований — кандидат надсилає звіт поштою
  const d = reportData(), t = d.timing;
  const base = `test_golovnyi_inzhener_${slug(d.candidate.name)}_${(t.finishedAt||'').slice(0,10)}`;
  const mailBody = `Добрий день!\n\nНадсилаю результати тесту на посаду «${CONFIG.position}».\nКандидат: ${d.candidate.name}, ${d.candidate.contact}\n\nУ вкладенні: ${base}.html, ${base}.json.\n\nЗ повагою,\n${d.candidate.name}`;
  const mailto = `mailto:${encodeURIComponent(CONFIG.resultsEmail)}?subject=${encodeURIComponent('Тест головного інженера — ' + d.candidate.name)}&body=${encodeURIComponent(mailBody)}`;
  app.innerHTML = `<div class="wrap"><article class="card">
    <span class="chip">Тест завершено</span>
    <h1>Дякуємо, ${esc(d.candidate.name)}!</h1>
    ${errorText ? `<div class="notice warn"><b>Автоматично надіслати результати не вдалося</b> (${esc(errorText)}). Перевірте інтернет і спробуйте ще раз, або надішліть звіт поштою — кнопки нижче.</div>` : `<div class="notice">Відповіді зафіксовано. Надішліть звіт поштою — кнопки нижче.</div>`}
    <div class="btn-row">
      ${errorText ? `<button class="btn" id="retry" type="button">Спробувати надіслати ще раз</button>` : ''}
      <button class="btn ${errorText?'secondary':''}" id="dl-html" type="button">Скачати звіт (HTML)</button>
      <button class="btn secondary" id="dl-json" type="button">Скачати звіт (JSON)</button>
      <a class="btn secondary" href="${mailto}">Написати листа на ${esc(CONFIG.resultsEmail)}</a>
    </div>
    <p class="small muted">Додайте до листа обидва скачані файли (і ескіз до C1, якщо є). Дані тесту лишаються в цьому браузері, доки ви їх не очистите.</p>
    <div class="btn-row" style="margin-top:24px"><button class="btn ghost" id="wipe" type="button">Очистити дані тесту з цього браузера</button></div>
  </article></div>`;
  $('#dl-json').addEventListener('click', () => download(base + '.json', JSON.stringify(reportData(), null, 2), 'application/json'));
  $('#dl-html').addEventListener('click', () => download(base + '.html', reportHtml(reportData()), 'text/html'));
  const r = $('#retry'); if (r) r.addEventListener('click', () => renderReport());
  $('#wipe').addEventListener('click', wipeData);
}

function wipeData(){
  if (!confirm('Видалити всі дані тесту з цього браузера?')) return;
  try { localStorage.removeItem(CONFIG.storageKey); } catch(e) {}
  state = freshState(); render();
}

function answersHtml(d){
  const css = `body{font:15px/1.5 system-ui,Arial,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#1b1f24}pre{white-space:pre-wrap;word-wrap:break-word;background:#f6f7f9;border:1px solid #dde2e8;border-radius:6px;padding:8px 10px;font:inherit}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #cfd6dd;padding:5px 8px;text-align:left}h3{margin:18px 0 6px}.muted{color:#5c6670}`;
  let h = `<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Відповіді — ${esc(d.candidate.name)}</title><style>${css}</style></head><body><h1>Копія відповідей</h1><p>${esc(d.meta.test)}<br>${esc(d.candidate.name)} · ${esc(fmtDT(d.timing.finishedAt))}</p>`;
  d.questions.forEach(q => {
    h += `<h3>${q.id}. ${esc(q.title)}</h3>`;
    if (!q.answered) { h += `<p class="muted">Без відповіді</p>`; return; }
    const shorts = q.answers.filter(a => a.key !== 'answer' && a.key !== 'solution' && a.value);
    if (shorts.length) h += `<table><tbody>${shorts.map(a=>`<tr><th style="width:45%">${esc(a.label)}</th><td>${esc(a.value)}</td></tr>`).join('')}</tbody></table>`;
    q.answers.filter(a => (a.key === 'answer' || a.key === 'solution') && a.value).forEach(a => { h += `<p class="muted">${esc(a.label)}</p><pre>${esc(a.value)}</pre>`; });
  });
  return h + `</body></html>`;
}

/* ---------- глосарій ---------- */
function glossaryHtml(filter, inline){
  const q = (filter || '').trim().toLowerCase();
  let h = '';
  GLOSSARY.forEach(grp => {
    const items = grp.items.filter(([t, d]) => !q || (t + ' ' + d).toLowerCase().includes(q));
    if (!items.length) return;
    h += `<h4>${esc(grp.g)}</h4><dl>` + items.map(([t, d]) => `<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join('') + `</dl>`;
  });
  if (!h) h = `<p class="muted">Нічого не знайдено.</p>`;
  const note = `<p class="g-note">Тут лише терміни з умов завдань. Поняття, знання яких перевіряється самим тестом (наприклад, марки розділів проєктної документації або етапи приймання обладнання), у глосарії свідомо відсутні.</p>`;
  return (inline ? '' : note) + h + (inline ? note : '');
}
const glossDlg = $('#gloss');
function openGlossary(){ $('#gloss-q').value = ''; $('#gloss-body').innerHTML = glossaryHtml('', false); if (typeof glossDlg.showModal === 'function') glossDlg.showModal(); else glossDlg.setAttribute('open', ''); $('#gloss-q').focus(); }
function closeGlossary(){ if (glossDlg.open) glossDlg.close(); else glossDlg.removeAttribute('open'); }
$('#gloss-btn').addEventListener('click', openGlossary);
$('#gloss-close').addEventListener('click', closeGlossary);
$('#gloss-q').addEventListener('input', e => { $('#gloss-body').innerHTML = glossaryHtml(e.target.value, false); });
glossDlg.addEventListener('click', e => { if (e.target === glossDlg) closeGlossary(); });
app.addEventListener('click', e => { if (e.target.closest('[data-gloss]')) openGlossary(); });

/* ---------- старт ---------- */
if (state.status === 'running') renderResumeScreen();
else render();
</script>
